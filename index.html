<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codificador de Senha por Etapas</title>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🔒 Codificador de Senha</h1>
    <p class="subtitle">Insira uma senha para ver o processo de encriptação em tempo real.</p>

    <div class="input-group">
      <input type="text" id="passwordInput" placeholder="Digite sua senha..." value="Segredo123" />
      <button onclick="codificar()">Codificar</button>
    </div>

    <!-- Resultados das Etapas -->
    <div id="steps" class="steps-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
